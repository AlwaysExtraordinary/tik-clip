name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (可选，留空则根据递增类型自动计算，如 v0.1.1)'
        required: false
        default: ''
        type: string
      bump_type:
        description: '版本号自动递增类型 (仅当未手动指定版本号时生效)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - auto
      release_title:
        description: 'Release 标题 (可选，留空则默认为 TikClip <版本号>)'
        required: false
        default: ''
        type: string
      release_notes:
        description: '更新说明 (可选，留空则由 AI 结合最近提交记录自动生成)'
        required: false
        default: ''
        type: string
      is_prerelease:
        description: '标记为 Pre-release (预发布版本)'
        required: true
        type: boolean
        default: false
      is_draft:
        description: '保存为 Draft 草稿 (推荐勾选！构建完成后可在 Release 页面核对后一键发布)'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    name: Prepare Release Metadata & Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.prep.outputs.tag_name }}
      pure_ver: ${{ steps.prep.outputs.pure_ver }}
      title: ${{ steps.prep.outputs.title }}
      body: ${{ steps.prep.outputs.body }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      draft: ${{ steps.prep.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate Version and Generate Changelog
        id: prep
        run: node scripts/release-helper.mjs prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP_TYPE: ${{ inputs.bump_type || 'patch' }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          INPUT_IS_PRERELEASE: ${{ inputs.is_prerelease || 'false' }}
          INPUT_IS_DRAFT: ${{ inputs.is_draft != false }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

  release:
    name: Build Desktop Application (${{ matrix.platform }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Sync Version to Tauri and Package.json
        run: node scripts/release-helper.mjs sync "${{ needs.prepare.outputs.pure_ver }}"

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: ${{ needs.prepare.outputs.title }}
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
